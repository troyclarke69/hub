<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Troy Clarke — Projects</title>
  <meta name="description" content="Troy Clarke — full-stack, data and AI projects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <script>
    // Apply a saved theme before paint so there's no flash.
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #111827;
      --muted: #5b6475;
      --border: #e3e6ec;
      --accent: #1d4ed8;
      --accent-2: #15803d;
      --chip: #eef1f6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0f17;
        --surface: #121826;
        --text: #e8ecf3;
        --muted: #8e98ab;
        --border: #222b3b;
        --accent: #60a5fa;
        --accent-2: #4ade80;
        --chip: #1a2233;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b0f17;
      --surface: #121826;
      --text: #e8ecf3;
      --muted: #8e98ab;
      --border: #222b3b;
      --accent: #60a5fa;
      --accent-2: #4ade80;
      --chip: #1a2233;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font: 400 16px/1.6 Inter, system-ui, sans-serif;
      padding: 0 16px;
    }
    a { color: inherit; }
    .wrap { max-width: 1040px; margin: 0 auto; }

    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 0; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 40px; height: 40px; border-radius: 14px; background: linear-gradient(135deg, #14532d, #1e3a8a 55%, #4ade80); }
    .brand b { display: block; font-weight: 600; }
    .brand span { color: var(--muted); font-size: 14px; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .links a {
      text-decoration: none; font-size: 14px; padding: 7px 14px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
    .nav { display: flex; gap: 8px; align-items: flex-start; }
    #theme { flex: none; }
    #theme {
      font: inherit; font-size: 15px; line-height: 1; cursor: pointer; color: var(--text);
      width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    }
    #theme:hover { border-color: var(--accent); color: var(--accent); }
    #theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .hero { padding: 48px 0 40px; max-width: 720px; }
    .hero h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 600; }
    .hero p { color: var(--muted); font-size: 18px; margin-top: 16px; }
    .stats { display: flex; gap: 28px; margin-top: 28px; flex-wrap: wrap; }
    .stats div { font-size: 14px; color: var(--muted); }
    .stats strong { display: block; font-size: 26px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 500; margin: 48px 0 16px; }

    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .filters button {
      font: inherit; font-size: 14px; cursor: pointer; color: var(--text);
      padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    }
    .filters button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
    .filters button .n { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
    #search {
      font: inherit; font-size: 14px; color: var(--text); flex: 1; min-width: 180px; max-width: 280px; margin-left: auto;
      padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    }
    #search:focus, .filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px; display: flex; flex-direction: column; gap: 10px;
      transition: border-color .15s, transform .15s; overflow: hidden;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card.featured { border-top: 3px solid var(--accent); }
    /* When featured cards have thumbnails, start the other cards on a fresh row,
       so a short card never shares a row with (and gets stretched to) one. */
    .card.featured:has(> .thumb) + .card:not(.featured) { grid-column-start: 1; }
    .thumb {
      margin: -20px -20px 6px; aspect-ratio: 16 / 9; background: var(--chip);
      border-bottom: 1px solid var(--border); overflow: hidden; display: block; text-decoration: none;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .thumb .ph {
      width: 100%; height: 100%; display: grid; place-items: center;
      font-size: 32px; font-weight: 600; letter-spacing: -0.02em; color: #fff;
      background: linear-gradient(135deg, #14532d, #1e3a8a 60%, #2563eb);
    }
    .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .card h3 { font-size: 17px; font-weight: 600; }
    .cat { font-size: 12px; color: var(--accent-2); white-space: nowrap; }
    .card p { color: var(--muted); font-size: 15px; flex: 1; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tags span { font: 400 12px "JetBrains Mono", monospace; background: var(--chip); padding: 3px 8px; border-radius: 6px; }
    .actions { display: flex; gap: 14px; font-size: 14px; }
    .actions a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .actions a:hover { text-decoration: underline; }
    .empty { color: var(--muted); padding: 24px 0; }

    .stack-note { color: var(--muted); font-size: 14px; margin: -6px 0 14px; }
    .stack { display: flex; gap: 6px; flex-wrap: wrap; }
    .stack button {
      font: 400 13px "JetBrains Mono", monospace; cursor: pointer; color: var(--text);
      padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
      display: inline-flex; gap: 8px; align-items: baseline;
    }
    .stack button:hover { border-color: var(--accent); color: var(--accent); }
    .stack button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .stack .n { color: var(--muted); font-variant-numeric: tabular-nums; }

    @media (max-width: 560px) {
      #search { max-width: none; margin-left: 0; }
    }

    footer { color: var(--muted); font-size: 14px; padding: 56px 0 40px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div><b id="name"></b><span id="tagline"></span></div>
      </div>
      <div class="nav">
        <nav class="links" id="links"></nav>
        <button id="theme" type="button"></button>
      </div>
    </header>

    <section class="hero">
      <h1 id="headline"></h1>
      <p id="intro"></p>
      <div class="stats" id="stats"></div>
    </section>

    <h2 id="projects">Projects</h2>
    <div class="toolbar">
      <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
      <input id="search" type="search" placeholder="Search by name or tech…" aria-label="Search projects">
    </div>
    <div class="grid" id="grid"></div>

    <h2>Tech stack</h2>
    <p class="stack-note" id="stack-note"></p>
    <div class="stack" id="stack"></div>

    <footer id="footer"></footer>
  </div>

  <script type="module">
    // Load projects.js fresh on every visit. GitHub Pages lets browsers cache
    // files for 10 minutes, which can pair a new page with stale data.
    await new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = `projects.js?v=${Date.now()}`;
      s.onload = resolve;
      s.onerror = reject;
      document.head.append(s);
    });

    const P = window.PROFILE, ALL = window.PROJECTS;
    const gh = (repo) => `https://github.com/troyclarke69/${repo}`;
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const $ = (id) => document.getElementById(id);

    $("name").textContent = P.name;
    $("tagline").textContent = P.tagline;
    $("headline").textContent = P.headline;
    $("intro").textContent = P.intro;
    $("links").innerHTML = Object.entries(P.links)
      .map(([k, v]) => {
        const attrs = v.startsWith("http") ? ' target="_blank" rel="noreferrer"' : v.endsWith(".pdf") ? " download" : "";
        return `<a href="${esc(v)}"${attrs}>${esc(k)}</a>`;
      })
      .join("");
    document.title = `${P.name} — Projects`;
    $("footer").innerHTML = `© ${new Date().getFullYear()} ${esc(P.name)} · <a href="${gh("hub")}" target="_blank" rel="noreferrer">Source for this page</a>`;

    const techCount = new Set(ALL.flatMap((p) => p.tech)).size;
    $("stats").innerHTML = [
      [ALL.length, "projects"],
      [techCount, "technologies"],
      [P.experience, "years experience"],
    ].map(([n, l]) => `<div><strong>${n}</strong>${l}</div>`).join("");

    const cats = ["All", ...new Set(ALL.map((p) => p.category))];
    let cat = "All", query = "";

    function renderFilters() {
      $("filters").innerHTML = cats.map((c) => {
        const n = c === "All" ? ALL.length : ALL.filter((p) => p.category === c).length;
        return `<button type="button" aria-pressed="${c === cat}" data-cat="${esc(c)}">${esc(c)}<span class="n">${n}</span></button>`;
      }).join("");
    }

    // A featured card shows a screenshot only when it has `image:` in
    // projects.js. If the image fails to load, the project's initials show instead.
    const initials = (t) => {
      const w = t.split(/\s+/);
      return (w.length > 1 ? w[0][0] + w[1][0] : t.slice(0, 2)).toUpperCase();
    };
    function thumb(p) {
      return `<a class="thumb" href="${esc(p.live || gh(p.repo))}" target="_blank" rel="noreferrer" tabindex="-1" aria-hidden="true">
        <img src="${esc(p.image)}" alt="" loading="lazy" data-initials="${esc(initials(p.title))}">
      </a>`;
    }
    $("grid").addEventListener("error", (e) => {
      const img = e.target;
      if (img.tagName !== "IMG") return;
      img.outerHTML = `<div class="ph">${esc(img.dataset.initials)}</div>`;
    }, true);

    function card(p) {
      return `<article class="card${p.featured ? " featured" : ""}">
        ${p.featured && p.image ? thumb(p) : ""}
        <div class="card-top"><h3>${esc(p.title)}</h3><span class="cat">${esc(p.category)}</span></div>
        <p>${esc(p.summary)}</p>
        <div class="tags">${p.tech.map((t) => `<span>${esc(t)}</span>`).join("")}</div>
        <div class="actions">
          <a href="${gh(p.repo)}" target="_blank" rel="noreferrer">Code →</a>
          ${p.live ? `<a href="${esc(p.live)}" target="_blank" rel="noreferrer">Live demo →</a>` : ""}
        </div>
      </article>`;
    }

    // How many projects use each tech tag, most-used first
    const stack = [...ALL.flatMap((p) => p.tech).reduce((m, t) => m.set(t, (m.get(t) || 0) + 1), new Map())]
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const isTag = new Set(stack.map(([t]) => t.toLowerCase()));

    function renderGrid() {
      const q = query.trim().toLowerCase();
      // A search that is exactly a tech tag (e.g. from the Tech stack list) matches
      // that tag only, so "Rust" doesn't also match "robust" in a summary.
      const matches = isTag.has(q)
        ? (p) => p.tech.some((t) => t.toLowerCase() === q)
        : (p) => [p.title, p.summary, ...p.tech].join(" ").toLowerCase().includes(q);
      const list = ALL
        .filter((p) => cat === "All" || p.category === cat)
        .filter((p) => !q || matches(p))
        .sort((a, b) => (b.featured === true) - (a.featured === true));
      $("grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">No projects match that search.</div>`;
    }

    $("filters").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      cat = b.dataset.cat;
      renderFilters(); renderGrid();
    });
    $("search").addEventListener("input", (e) => { query = e.target.value; renderGrid(); });

    $("stack-note").textContent =
      `${stack.length} languages, frameworks and libraries, taken from each project's dependencies, with the number of projects that use each. Select one to see those projects.`;
    $("stack").innerHTML = stack
      .map(([t, n]) => `<button type="button" data-tech="${esc(t)}" aria-label="${esc(t)}, used in ${n} project${n > 1 ? "s" : ""}">${esc(t)}<span class="n">${n}</span></button>`)
      .join("");
    $("stack").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      cat = "All";
      query = $("search").value = b.dataset.tech;
      renderFilters(); renderGrid();
      $("projects").scrollIntoView({ behavior: "smooth" });
    });

    renderFilters(); renderGrid();

    const root = document.documentElement;
    const dark = matchMedia("(prefers-color-scheme: dark)");
    const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : dark.matches;
    function renderTheme() {
      const d = isDark();
      $("theme").textContent = d ? "☀" : "☾";
      $("theme").setAttribute("aria-label", d ? "Switch to light mode" : "Switch to dark mode");
      $("theme").title = $("theme").getAttribute("aria-label");
    }
    $("theme").addEventListener("click", () => {
      root.dataset.theme = isDark() ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
      renderTheme();
    });
    dark.addEventListener("change", renderTheme);
    renderTheme();
  </script>
</body>
</html>
